services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: mm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend